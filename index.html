<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SprunkLeak</title>

  <style>
    #changer {
      transition: opacity 0.5s ease;
    }
    .fade-out {
      opacity: 0;
    }
    .fade-in {
      opacity: 1;
    }
  </style>
</head>

<body>
  <h1>
    Play <span id="changer"></span> at the age of Sprunki
  </h1>

  <script>
    const words = ["archives", "preserved games", "playable SB3s", "smooth games"];
    let i = 0;

    const el = document.getElementById("changer");

    function changeWord() {
      el.classList.add("fade-out");

      setTimeout(() => {
        el.textContent = words[i];
        el.classList.remove("fade-out");
        el.classList.add("fade-in");
        i = (i + 1) % words.length;
      }, 500);
    }

    el.textContent = words[0];
    setInterval(changeWord, 2000);
  </script>
</body>
</html>
